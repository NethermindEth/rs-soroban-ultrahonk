name: CI

on:
  push:
    branches: main
  pull_request:
    branches: main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  shear:
    name: Unused dependencies (cargo-shear)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install cargo-shear
        run: cargo install cargo-shear --version 1.13.4 --locked

      - name: Check for unused dependencies
        run: cargo shear

  deny:
    name: Dependency policy (cargo-deny)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.20.2 --locked

      - name: Check advisories, licenses, bans, and sources
        run: cargo deny --locked --all-features check

  msrv:
    name: Minimum supported Rust (1.92.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust 1.92.0
        run: |
          rustup toolchain install 1.92.0 --profile minimal --target wasm32v1-none --no-self-update
          rustup default 1.92.0

      - name: Verify packaged verifier with default features
        run: cargo package -p ultrahonk_soroban_verifier --locked

      - name: Verify packaged verifier with all features
        run: cargo package -p ultrahonk_soroban_verifier --locked --all-features

      - name: Compile tests on Rust 1.92.0
        run: cargo test -p ultrahonk_soroban_verifier --locked --no-run --all-features

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@300aaf69ab100536678bdb641428b06f06b318ea # v28.0.0
        with:
          version: v28.0.0

      - name: Build verifier contract Wasm on Rust 1.92.0
        run: stellar contract build --package rs-soroban-ultrahonk --locked

  package:
    name: Verify crates.io package (no upload)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Inspect package contents
        run: cargo package -p ultrahonk_soroban_verifier --locked --list

      - name: Dry-run publication with default features
        run: cargo publish -p ultrahonk_soroban_verifier --registry crates-io --locked --dry-run

      - name: Dry-run publication with all features
        run: cargo publish -p ultrahonk_soroban_verifier --registry crates-io --locked --dry-run --all-features

      - name: Build API documentation
        run: cargo doc -p ultrahonk_soroban_verifier --locked --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --no-self-update
          rustup default stable

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@300aaf69ab100536678bdb641428b06f06b318ea # v28.0.0
        with:
          version: v28.0.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Noir
        uses: noir-lang/noirup@v0.1.3
        with:
          toolchain: "1.0.0-beta.9"

      - name: Install bb
        run: |
          curl -L https://raw.githubusercontent.com/AztecProtocol/aztec-packages/refs/heads/next/barretenberg/bbup/install | bash
          echo "$HOME/.bb" >> $GITHUB_PATH
          $HOME/.bb/bbup -v 0.87.0

      - name: Cache cargo directories
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup environment
        run: ./scripts/setup.sh

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Build optimized contract Wasm
        run: stellar contract build --optimize

      - name: Build tornado contracts Wasm (wasm-cost)
        run: stellar contract build --optimize --features wasm-cost
        working-directory: contracts/tornado_classic/contracts

      - name: Build all circuits
        run: ./circuits/scripts/build_all.sh

      - name: Check circuit artifacts against known-good hashes
        run: ./circuits/scripts/check_artifact_hashes.sh

      - name: Run workspace tests
        run: cargo test --workspace --verbose

      - name: Test verifier with all features
        run: cargo test -p ultrahonk_soroban_verifier --locked --all-features

      - name: Run integration tests
        run: RUST_TEST_THREADS=1 cargo test -p rs-soroban-ultrahonk --test integration_tests -- --nocapture
