name: E2E

on:
  push:
    branches: main
  pull_request:
    branches: main
    paths:
      - 'contracts/**'
      - 'scripts/**'
      - 'crates/**'
      - 'Cargo.toml'
      - 'Cargo.lock'

env:
  CARGO_TERM_COLOR: always

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  localnet-e2e:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Stellar CLI
        uses: stellar/stellar-cli@300aaf69ab100536678bdb641428b06f06b318ea # v28.0.0
        with:
          version: v28.0.0

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Noir
        uses: noir-lang/noirup@v0.1.3
        with:
          toolchain: "1.0.0-beta.9"

      - name: Install bb
        run: |
          curl -sSfL -o /tmp/bb.tar.gz https://github.com/AztecProtocol/aztec-packages/releases/download/v0.87.0/barretenberg-amd64-linux.tar.gz
          echo "829b714287085ff4562ba2c64f9c8128463650d833bdd1db5d5a33471dcd67cb  /tmp/bb.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.bb"
          tar -xzf /tmp/bb.tar.gz -C "$HOME/.bb" bb
          echo "$HOME/.bb" >> $GITHUB_PATH

      - name: Cache cargo directories
        uses: actions/cache@v3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Setup environment
        run: ./scripts/setup.sh

      - name: Run localnet end-to-end verify_proof + measurement
        run: scripts/run_localnet_e2e.sh
