[package]
name = "ultrahonk_soroban_verifier"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
publish = ["crates-io"]

license.workspace = true
description = "UltraHonk proof verifier for Soroban smart contracts using the non-ZK UltraKeccak flavor"
repository = "https://github.com/NethermindEth/rs-soroban-ultrahonk"
readme = "README.md"
keywords = ["ultrahonk", "noir", "soroban", "stellar", "cryptography"]
categories = ["cryptography", "no-std"]
include = ["/Cargo.toml", "/src/**", "/README.md", "/LICENSE-MIT", "/LICENSE-APACHE", "/VERIFIER_PROVENANCE.md"]

[package.metadata.docs.rs]
all-features = true
targets = ["x86_64-unknown-linux-gnu"]

[dependencies]
soroban-sdk = { workspace = true }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ultrahonk-test-utils = { path = "../test-utils" }

[features]
default = []
std = []
trace = []
